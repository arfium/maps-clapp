[package]
name = "maps"
version = "0.2.0"
edition = "2021"
description = "A world map on one screen a human and an agent share — cross-platform via clappkit + Tauri."
license = "Apache-2.0"

[[bin]]
name = "maps"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tauri` feature = the GUI half clappkit owns (icon, window verbs, the `asset` command,
# the GUI<->CLI relay). It pulls the same tauri version + features declared below, so
# opting in adds nothing to the dependency graph — it only moves code out of this app.
clappkit = { path = "../clappkit", features = ["tauri"] }
tauri = { version = "2", features = ["image-png"] }
# "fs": exports (GeoJSON/GPX) are written off the worker threads. No "process" — this app
# drives no child; everything it needs is an HTTPS call away.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Local weekday+minute for the opening-hours evaluation — the one thing std cannot give.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The OS locale, for turn instructions in the user's own language. Env vars are not it:
# a macOS GUI process has no LANG.
sys-locale = "0.3"
# Three open services: Photon (search), Nominatim (precise address + reverse), Valhalla
# (routing, isochrones). rustls, never native-tls, so the build stays portable.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
