<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maps</title>
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("root");
        var msg = e && e.target && e.target.src ? "failed to load " + e.target.src : (e && e.message) || String(e);
        if (el) el.innerHTML = '<pre style="padding:20px;color:#a00;white-space:pre-wrap;font:13px monospace">maps: ' + msg + "</pre>";
      }, true);
    </script>
  </head>
  <body>
    <div id="root"><div style="padding:24px;font:15px -apple-system,sans-serif;color:#666">Loading Maps…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
